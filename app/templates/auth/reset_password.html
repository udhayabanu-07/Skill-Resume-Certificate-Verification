{% extends "base.html" %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="brand-badge mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                            <i class="bi bi-shield-check"></i>
                        </span>
                        <h3 class="fw-bold mb-1" style="color: var(--navy-900);">Set New Password</h3>
                        <p class="text-muted small">Choose a secure password for your account</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="new_password" class="form-label form-label-custom">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control form-control-custom" id="new_password" name="new_password" required minlength="8" placeholder="At least 8 characters">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label form-label-custom">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" class="form-control form-control-custom" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Repeat new password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-teal w-100 py-2 fs-6 mb-2">
                            <i class="bi bi-check-circle"></i> Save New Password
                        </button>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary w-100 py-2 fs-6">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
